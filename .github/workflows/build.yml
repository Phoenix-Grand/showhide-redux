name: Build ShowHide

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ShowHide/ShowHide.csproj

      - name: Publish self-contained EXE
        run: dotnet publish ShowHide/ShowHide.csproj -c Release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowHide-self-contained
          path: ShowHide/bin/Release/net8.0-windows/win-x64/publish/
